<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ULUsignals — Coming Soon">
  <title>ULUsignals — Coming Soon</title>

  <style>
    :root {
      --bg: #061a33;
      --bg-deep: #031226;
      --panel: rgba(9, 33, 63, 0.70);
      --line: rgba(104, 194, 255, 0.26);
      --blue: #50b9ff;
      --blue-soft: #a9dcff;
      --text: #f4f9ff;
      --muted: #adc1d8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-deep);
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 28%, rgba(43, 139, 214, 0.15), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(35, 119, 186, 0.12), transparent 42%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .24;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 85%);
    }

    header {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo {
      height: 60px;
      width: auto;
      max-width: min(100%, 360px);
      display: block;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 16px rgba(80,185,255,.85);
    }

    main {
      flex: 1;
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 48px 0 64px;
    }

    .hero {
      width: min(980px, 100%);
      text-align: center;
    }

    .hero-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 30px;
    }

    .hero-logo .brand-logo {
      height: 60px;
      width: auto;
      max-width: min(100%, 360px);
      display: block;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--blue-soft);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue));
    }

    .eyebrow::after {
      background: linear-gradient(90deg, var(--blue), transparent);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 8vw, 7.8rem);
      line-height: .92;
      letter-spacing: -0.065em;
      font-weight: 760;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-top: .13em;
      color: var(--blue);
    }

    .subhead {
      width: min(690px, 100%);
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.7;
      text-wrap: balance;
    }

    .graphic-wrap {
      position: relative;
      width: min(940px, 100%);
      margin: 48px auto 0;
      padding: 1px;
      border-radius: 22px;
      background: linear-gradient(
        135deg,
        rgba(91,192,255,.42),
        rgba(91,192,255,.06) 42%,
        rgba(255,255,255,.04)
      );
      box-shadow:
        0 28px 90px rgba(0,0,0,.28),
        0 0 70px rgba(45,157,230,.06);
    }

    .graphic-frame {
      position: relative;
      overflow: hidden;
      border-radius: 21px;
      background: rgba(1, 19, 39, .78);
      border: 1px solid rgba(255,255,255,.035);
      padding: clamp(10px, 2vw, 18px);
    }

    .graphic-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 35%);
    }

    .graphic {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .note {
      margin-top: 32px;
      color: #7f98b3;
      font-size: .9rem;
      letter-spacing: .02em;
    }

    footer {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 0 0 28px;
      display: flex;
      justify-content: center;
      color: #6f879f;
      font-size: .78rem;
      letter-spacing: .03em;
      text-align: center;
    }

    @media (max-width: 720px) {
      header,
      main,
      footer {
        width: min(100% - 32px, 1180px);
      }

      header {
        padding-top: 22px;
      }

      .brand-logo {
        height: auto;
        width: min(100%, 300px);
        max-width: calc(100vw - 96px);
      }

      .hero-logo {
        margin-bottom: 24px;
      }

      .status {
        font-size: .68rem;
        letter-spacing: .09em;
      }

      main {
        padding: 34px 0 46px;
      }

      .eyebrow {
        font-size: .7rem;
        letter-spacing: .14em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 26px;
      }

      h1 {
        font-size: clamp(3.1rem, 18vw, 5.2rem);
      }

      .subhead {
        margin-top: 22px;
        font-size: 1rem;
        line-height: 1.6;
      }

      .graphic-wrap {
        margin-top: 36px;
        border-radius: 16px;
      }

      .graphic-frame {
        border-radius: 15px;
        padding: 8px;
      }

      .graphic {
        border-radius: 10px;
      }
    }

    @media (max-width: 460px) {
      .status {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <main>
      <section class="hero" aria-labelledby="coming-soon-title">
        <div class="hero-logo">
          <img src="logos/ULUsignals-Logo-Aud-Intell-whlet.svg"
               alt="ULU signals logo"
               class="brand-logo">
        </div>

        <div class="eyebrow">Something new is taking shape</div>

        <h1 id="coming-soon-title">
          Coming
          <span>Soon.</span>
        </h1>

        <p class="subhead">
          We're building the next ULUsignals experience — designed to help turn
          every communication into clearer signals, stronger insight, and smarter action.
        </p>

        <div class="graphic-wrap" aria-label="Every Message Teaches graphic">
          <div class="graphic-frame">
            <img
              class="graphic"
              src="assets/audience-engine-tr.png"
              alt="ULUsignals Every Message Teaches graphic"
            >
          </div>
        </div>

        <div class="note">ULUsignals by ULU Technologies</div>
      </section>
    </main>

    <footer>
      &copy; 2026 ULU Technologies Inc. All rights reserved.
    </footer>
  </div>
</body>
</html>

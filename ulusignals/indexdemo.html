<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ULUsignals – audience intelligence layer</title>
 <link rel="icon" type="image/png" sizes="32x32" href="images/SignalOS-favicon.png">
  <style>
    :root{
      --page-bg: #f2f5f9;
      --panel-bg: #07204f;
      --panel-bg-2: #151d31;
      --panel-border: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.90);
      --muted: rgba(255,255,255,.65);
      --muted-2: rgba(255,255,255,.48);
      --tab-inactive: #cdd5e0;
      --tab-active: #07204f;
      --accent: #e9c56a;
      --shadow: 0 18px 40px rgba(10, 14, 25, .18);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --gap: 18px;
    }

    * { box-sizing: border-box; }
    body{
      margin: 0;
      background: var(--page-bg);
      color: #0b1020;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .app-wrap{
      max-width: none; /* allow full-width panel */
      margin: 0;
      padding: 0;
    }

    .topbar{
      display: flex;
      align-items: flex-end;
      gap: 22px;
      padding: 18px 18px 0; /* restore outer gutters now that app-wrap is full-width */
      background: var(--page-bg);
    }
    .brand{
      display:flex;
      align-items:flex-end;
      gap: 10px;
      min-width: 200px;
    }
    .brand img{
      width: 200px;
      height: auto;
      display:block;
      padding-bottom: 7px;
    }

    .main-tabs{
      display:flex;
      align-items:flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 0;
    }
    .main-tab{
      border: 0;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 14px 14px 0 0;
      background: var(--tab-inactive);
      color: rgba(10,16,32,.78);
      font-weight: 650;
      letter-spacing: .1px;
      display:flex;
      align-items:center;
      gap: 10px;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.05);
      transition: transform .08s ease, background .12s ease, color .12s ease;
    }
    .main-tab:active{ transform: translateY(1px); }
    .main-tab[aria-selected="true"]{
      background: var(--tab-active);
      color: rgba(255,255,255,.92);
      box-shadow: none;
    }
    .main-tab svg{ width: 22px; height: 22px; opacity: .92; }
    .main-tab[aria-selected="false"] svg{ opacity: .65; }

    .topbar-right{
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      padding-bottom: 4px;
      min-width: 260px;
      padding-right: 4px;
    }
    .icon-row{ display: flex; align-items: center; gap: 14px; }
    .icon-btn{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(10,16,32,.10);
      background: rgba(255,255,255,.0);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .12s ease, transform .08s ease, border-color .12s ease;
    }
    .icon-btn:hover{
      background: rgba(10,16,32,.04);
      border-color: rgba(10,16,32,.18);
    }
    .icon-btn:active{ transform: translateY(1px); }
    .icon-btn img{
      width: 22px;
      height: 22px;
      display: block;
      opacity: .9;
    }

    .company-name{
      font-size: 16px;
      letter-spacing: .3px;
      color: rgba(10,16,32,.80);
      font-weight: 650;
      white-space: nowrap;
      user-select: none;
      padding-bottom: 5px;
      text-align: right;
    }

    .panel{
      background: linear-gradient(180deg, var(--panel-bg), var(--panel-bg-2));
      width: 100%;
      border-radius: 0;              /* edge-to-edge like Screenshot E */
      box-shadow: none;
      border: 0;
      padding: 0;                    /* inner padding moved to .panel-inner */
      margin-top: 0;
    }

/* --- Generic info tooltips (Option A) --- */
.panel{ position: relative; } /* anchor for top-right info icon */

.panel-info-btn{
  position: absolute;
  top: 12px;
  right: 12px;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.92);
  font-size: 14px;
  font-weight: 750;
  line-height: 24px;
  text-align: center;
  cursor: pointer;
  padding: 0;
  display: grid;
  place-items: center;
  transition: background .12s ease, border-color .12s ease, transform .08s ease;
  z-index: 5;
}

/* Inline tooltip icons used inside Intelligence Brief subhead rows (prevents absolute positioning) */
.brief-h-row .panel-info-btn{
  position: static;
  top: auto;
  right: auto;
  bottom: auto;
  left: auto;
  margin: 0;
  transform: none;
  align-self: center;
  flex: 0 0 auto;
}

.panel-info-btn:hover{
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.32);
}
.panel-info-btn:active{ transform: translateY(1px); }
.panel-info-btn:focus{
  outline: 2px solid rgba(255,255,255,0.35);
  outline-offset: 2px;
}

/* Floating tooltip shell (single instance managed by JS) */
.tooltip-float[hidden]{ display:none; }
.tooltip-float{
  position: absolute;
  width: min(520px, calc(100vw - 64px));
  background: #f8fafc;
  color: #1e293b;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,.35);
  z-index: 9999;
  padding: 22px 22px 24px;
  border: 1px solid rgba(10,16,32,0.10);
}

.tooltip-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.tooltip-title{
  font-size: 20px;
  font-weight: 700;
  color: #0f172a;
  letter-spacing: .2px;
}

.tooltip-close{
  background: none;
  border: none;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  color: #64748b;
  padding: 2px 6px;
  border-radius: 10px;
}
.tooltip-close:hover{color: #0f172a;background: rgba(15,23,42,0.06);}
.tooltip-divider{height: 2px;background: var(--accent);margin: 12px 0 14px;border-radius: 1px;}
.tooltip-body{font-size: 16px;line-height: 1.3;color: #334155;}
.tooltip-body table { width: 100%; border-collapse: collapse; margin-top: 1px;margin-bottom: 4px; }
.tooltip-body td, .tooltip-body th { padding: 6px 6px; border-top: 1px solid rgba(255,255,255,.12); vertical-align: top; }
.tooltip-body tr:first-child td { border-top: 0; }

    .subtabs{
      display:flex;
      gap: 26px;
      padding: 8px 10px 16px;
      align-items:center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .subtab{
      position: relative;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 10px 2px 12px;
      font-size: 15px;
      letter-spacing: .1px;
      white-space: nowrap;
      transition: color .12s ease;
    }
    .subtab:hover{ color: rgba(255,255,255,.82); }
    .subtab[aria-selected="true"]{
      color: var(--accent);
      font-weight: 650;
    }
    .subtab[aria-selected="true"]::after{
      content:"";
      position:absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      opacity: .95;
    }
    /* -----------------------------
       Global Filters bar (shared shell)
       ----------------------------- */
    .global-filters{
      margin: 0 10px 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      border-radius: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .gf-left{
      display:flex;
      align-items:center;
      gap: 8px;
      color: rgba(255,255,255,.65);
      font-size: 13px;
      letter-spacing: .15px;
      user-select:none;
      margin-right: 4px;
    }
    .gf-left svg{ width:16px;height:16px; opacity:.75; }
    .gf-controls{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:center;
    }
    .gf-dd{ position: relative; }
    .gf-dd-btn{
      height: 34px;
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.88);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      white-space: nowrap;
    }
    .gf-dd-btn:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.18); }
    .gf-dd-btn:active{ transform: translateY(1px); }
    .gf-dd-chev{ opacity: .75; font-weight: 900; }
    .gf-menu[hidden]{ display:none; }
    .gf-menu{
      position:absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 260px;
      max-height: 320px;
      overflow:auto;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(20, 28, 45, .98);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      padding: 6px;
      z-index: 50;
    }
    .gf-item{
      width: 100%;
      text-align:left;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.86);
      padding: 10px 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .gf-item:hover{ background: rgba(255,255,255,.06); }
    .gf-item[aria-selected="true"]{
      background: rgba(233,197,106,.14);
      color: rgba(255,255,255,.92);
      border: 1px solid rgba(233,197,106,.22);
    }
    .gf-actions{
      display:flex;
      align-items:center;
      gap: 10px;
      margin-left: 4px;
    }
    .gf-btn{
      height: 34px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .gf-btn:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.18); }
    .gf-btn.primary{
      background: rgba(66, 120, 255, .25);
      border-color: rgba(66, 120, 255, .45);
    }
    .gf-btn.primary:hover{ background: rgba(66, 120, 255, .33); }
    @media (max-width: 700px){
      .global-filters{ justify-content:flex-start; }
      .gf-menu{ min-width: min(320px, calc(100vw - 32px)); }
      .gf-actions{width: 100%;flex-basis: 100%;justify-content: center;margin-left: 0;padding-top: 10px;}
    }

    .content-row{display:grid;grid-template-columns: 2fr 1fr;gap: var(--gap);padding: 8px 10px 10px;}
    .card{background: rgba(255,255,255,.03);border: 1px solid var(--panel-border);padding: 18px;min-height: 420px;position: relative;overflow: hidden;}
    .card h3{margin: 0 0 12px;color: rgba(255,255,255,.92);font-size: 18px;letter-spacing: .15px;}
    .card p{margin: 0 0 12px;color: var(--muted);line-height: 1.5;font-size: 14px; }

    /* -----------------------------
       Media: Overview
       ----------------------------- */
    .media-header h2{ margin: 0 0 6px; color: rgba(255,255,255,.94); font-size: 26px; letter-spacing: .2px; }
    .media-header p{ margin: 0 0 14px; color: var(--muted); }
    .media-scroll{ max-height: 540px; overflow: auto; padding-right: 6px; 
        scrollbar-color: rgba(255,255,255,.25) #223344;
        -webkit-overflow-scrolling: touch; padding-bottom:8px; 
    }
    .media-grid{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .media-grid--3{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .media-tile{ background: rgba(0,0,0,.10); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; }
    .media-tile-head{ display:flex; align-items:center; gap: 10px; margin-bottom: 10px; }
    .media-ico{ width: 26px; height: 26px; border-radius: 8px; display:grid; place-items:center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); color: rgba(255,255,255,.88); font-weight: 800; font-size: 13px; }
    .media-name{ color: rgba(255,255,255,.92); font-weight: 700; letter-spacing: .15px; }

    .metric-row{ display:flex; align-items:center; justify-content:space-between; color: rgba(255,255,255,.62); font-size: 12px; }
    .metric-badge{ font-size: 12px; font-weight: 800; letter-spacing: .6px; color: rgba(255,255,255,.92); }

    .bar-wrap{ height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 8px; }
    .bar-fill{ height: 100%; width: 50%; background: rgba(233,197,106,.95); border-radius: 999px; }
    .bar-fill.good{ background: rgba(118, 207, 134, .90); }
    .bar-fill.warn{ background: rgba(233,197,106,.95); }
    .bar-fill.bad{ background: rgba(240,138,75,.90); }
    .bar-fill.blue{ background: rgba(85,140,255,.85); }

    .tile-foot{ display:flex; justify-content:space-between; gap: 10px; margin-top: 12px; color: rgba(255,255,255,.72); font-size: 12px; }
    .tile-stat b{ color: rgba(255,255,255,.92); }
    .arrow-up{ color: rgba(118, 207, 134, .95); font-weight: 900; }
    .arrow-flat{ color: rgba(233,197,106,.95); font-weight: 900; }

    /* -----------------------------
       Media: Patterns
       ----------------------------- */
    .media-patterns{ display:flex; flex-direction:column; gap: 14px; }
    .media-pattern-row{ display:grid; grid-template-columns: 1.6fr .9fr; gap: 14px; align-items: stretch; }
    .media-pattern-left,
    .media-pattern-right{ background: rgba(0,0,0,.10); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 14px; }

    .media-pattern-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
    .media-pattern-title{ display:flex; align-items:center; gap: 10px; color: rgba(255,255,255,.92); font-weight: 750; font-size: 16px; }
    .media-pattern-chart{ height: 150px; width: 100%; }

    .media-pattern-right-title{ color: rgba(255,255,255,.92); font-weight: 750; margin-bottom: 10px; }
    .media-pattern-list{ display:flex; flex-direction:column; gap: 10px; }
    .media-pattern-li{ color: rgba(255,255,255,.78); font-size: 14px; }
    .media-pattern-li b{ color: rgba(255,255,255,.94); }

.media-patterns-v2{display:flex;flex-direction:column;gap:14px;max-height: 60vh;overflow-y: auto;padding-right: 10px;}
.media-patterns-v2::-webkit-scrollbar{ width: 10px; }
.media-patterns-v2::-webkit-scrollbar-thumb{background: rgba(255,255,255,.14);border-radius: 10px;}
.media-patterns-v2::-webkit-scrollbar-track{background: rgba(255,255,255,.06);}
.pattern-box .mini-head{display:flex;align-items:center;justify-content:space-between;padding: 2px 4px 8px;}
.pattern-box .mini-kebab{opacity:.65;letter-spacing:2px;}
.pattern-box .mini-title{font-size: 16px;font-weight: 650;letter-spacing: .2px;color: rgba(255,255,255,.86);}

.echart-pattern{ height: 160px; }
.echart-pattern-short{ height: 140px; }

/* Media / Patterns charts – increase vertical space */
#chart-media-patterns-sharedThemes,
#chart-media-patterns-riskFactors,
#chart-media-patterns-styleBreakdown {
  height: 260px;   /* desktop baseline */
}




    /* -----------------------------
       Media: responsive tweaks
       ----------------------------- */
    @media (max-width: 768px) {
  #chart-media-patterns-sharedThemes,
  #chart-media-patterns-riskFactors,
  #chart-media-patterns-styleBreakdown {height: 220px;}
    }
       
    @media (max-width: 820px){
      /* Media tiles: prevent text from colliding by limiting to 2 columns */
      .media-grid--3{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .media-patterns-v2{max-height: 950px;padding-right: 0;}
    }
    @media (max-width: 520px){
      /* Small phones: single column is safer */
      .media-grid,
      .media-grid--3{ grid-template-columns: 1fr; }
        .echart-pattern{ height: 150px; }
        .echart-pattern-short{ height: 130px; }
        .pattern-box .mini-title{ font-size: 15px; }
        .media-patterns-v2{max-height: none;overflow-y: visible;}

      /* Patterns: reduce the perceived outer margins around charts */
      .card{ padding: 12px; }
      .content-row{ padding: 6px 8px 10px; }
      .media-pattern-row{ gap: 10px; }
      .media-pattern-left,
      .media-pattern-right{ padding: 10px; border-radius: 14px; }
      .media-pattern-chart{ height: 140px; }
      
    #chart-media-patterns-sharedThemes,
    #chart-media-patterns-riskFactors,
    #chart-media-patterns-styleBreakdown,
    #chart-media-patterns-messageLength {
    height: 240px !important;
    min-height: 240px !important;
        }
    }
    .heatmap-wrap{background: rgba(0,0,0,.35);border: 1px solid rgba(255,255,255,.08);border-radius: 12px;padding: 12px;}
    .heatmap-wrap img{width: 100%;height: auto;display:block;border-radius: 10px;}
    .legend{display:flex;justify-content:center;gap: 22px;padding-top: 10px;color: var(--muted-2);font-size: 12px;align-items:center;}
    .dot{width: 10px; height: 10px;border-radius: 3px;display:inline-block;margin-right: 8px;border: 1px solid rgba(255,255,255,.18);}
    .dot.u{ background: #707889; }
    .dot.l{ background: #61c6a6; }
    .dot.m{ background: #e9c56a; }
    .dot.h{ background: #f08a4b; }

/* Real-Time: give charts consistent sizing */
#chart-signals-realtime-pulse { height: 240px; }
#chart-signals-realtime-flow,
#chart-signals-realtime-volatility { height: 170px; }
    


/* -----------------------------
   Signals: single dashboard panel
   ----------------------------- */
#subtabs[hidden]{display:none !important;}
#content.signals-content-row,
.content-row.signals-content-row{grid-template-columns:1fr;padding:8px 12px 12px;}
.content-row.signals-content-row > .card{padding:0;background:transparent;border:0;overflow:visible;min-height:0;}
.signals-dashboard{display:flex;flex-direction:column;gap:14px;color:rgba(255,255,255,.88);}
.signals-dashboard .sig-card{position:relative;background:linear-gradient(145deg,rgba(8,31,64,.78),rgba(4,20,44,.88));border:1px solid rgba(120,180,255,.16);border-radius:10px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden;min-width:0;}
.signals-dashboard .sig-card h3{margin:0 0 12px;color:rgba(255,255,255,.94);font-size:17px;font-weight:800;letter-spacing:-.01em;}
.signals-dashboard .sig-info{top:14px;right:14px;width:24px;height:24px;font-size:13px;line-height:22px;}
.sig-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.sig-score-layout{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;min-height:132px;}
.sig-chart{width:100%;min-width:0;max-width:100%;}
.signals-dashboard .sig-card > .sig-chart{overflow:hidden;}
.sig-gauge{height:132px;}
.sig-spark{height:78px;margin-top:-4px;}
.sig-radar{height:235px;}
.sig-donut{height:230px;}
.sig-response-card{container-type:inline-size;}
.sig-response-breakdown-layout{display:grid;grid-template-columns:minmax(165px,1fr) minmax(104px,128px);gap:6px;align-items:center;min-height:230px;}
.sig-response-breakdown-layout .sig-donut{height:226px;min-width:0;margin:0;}
.sig-response-legend{display:grid;gap:7px;min-width:0;padding-right:0;}
.sig-response-legend-row{display:grid;grid-template-columns:12px minmax(0,1fr);grid-template-areas:"dot label" ". value";column-gap:7px;row-gap:1px;align-items:start;color:rgba(255,255,255,.82);font-size:12px;line-height:1.15;min-width:0;}
.sig-response-dot{grid-area:dot;width:10px;height:10px;border-radius:3px;margin-top:2px;box-shadow:0 0 0 1px rgba(255,255,255,.12);}
.sig-response-label{grid-area:label;min-width:0;overflow-wrap:anywhere;}
.sig-response-legend-row strong{grid-area:value;color:#fff;font-size:12px;font-weight:850;}
.sig-response-legend-row small{grid-area:value;color:rgba(255,255,255,.64);font-size:11px;margin-left:34px;white-space:nowrap;}
@container (max-width: 360px){.sig-response-breakdown-layout{grid-template-columns:minmax(188px,220px) minmax(96px,116px);justify-content:center;gap:0;min-height:260px;}.sig-response-breakdown-layout .sig-donut{height:260px;}.sig-response-legend{gap:6px;transform:translateX(-8px);padding:0;}.sig-response-legend-row{font-size:12px;}.sig-response-legend-row small{font-size:10.5px;margin-left:30px;}}
@container (max-width: 315px){.sig-response-breakdown-layout{grid-template-columns:1fr;gap:0;min-height:0;}.sig-response-breakdown-layout .sig-donut{height:260px;}.sig-response-legend{width:min(230px,100%);justify-self:center;transform:translateX(-14px);grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;padding:0 0 4px;}}
.sig-barline{height:265px;}
.sig-delta{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;color:rgba(255,255,255,.72);font-size:14px;line-height:1.25;}
.sig-delta span{font-size:22px;font-weight:900;color:#68de58;}
.sig-delta small{font-size:13px;color:rgba(255,255,255,.78);}
.sig-momentum-row{display:flex;align-items:flex-end;gap:12px;min-height:54px;}
.sig-momentum-row strong{font-size:40px;line-height:.9;color:#70db58;font-weight:950;letter-spacing:-.04em;}

<!-- Responsive ECharts resizing (keeps charts at 100% width on browser resize) -->
<script>
  (function(){
    function resizeAllECharts(){
      if (!window.echarts) return;

      // Some modules mount charts into divs that don't have the .echart class.
      // ECharts adds a DOM attribute named _echarts_instance_ to the real container.
      // Resizing by that attribute ensures *all* charts respond (including Trends panel).
      var nodes = document.querySelectorAll('.echart, [_echarts_instance_]');
      nodes.forEach(function(el){
        var inst = window.echarts.getInstanceByDom(el);
        if (inst) inst.resize();
      });
    }

    // Resize on window changes
    window.addEventListener('resize', function(){
      window.requestAnimationFrame(resizeAllECharts);
    });

    // Resize when any chart container changes size (grid/flex reflow, sidebar, etc.)
    if (window.ResizeObserver){
      var ro = new ResizeObserver(function(){
        window.requestAnimationFrame(resizeAllECharts);
      });
      // Observe the main content region (covers tab swaps / layout changes)
      var content = document.getElementById('content');
      if (content) ro.observe(content);
      // Also observe chart containers that exist at load time
      document.querySelectorAll('.echart, [_echarts_instance_]').forEach(function(el){ ro.observe(el); });
    }

    // When tabs/subtabs swap content, chart DOM nodes are replaced. Watch for new charts
    // and trigger a resize after ECharts attaches its instance attribute.
    if (window.MutationObserver){
      var mo = new MutationObserver(function(){
        // Debounce a little to allow chart init to finish
        clearTimeout(window.__echartsResizeTimer);
        window.__echartsResizeTimer = setTimeout(resizeAllECharts, 60);
      });
      var contentNode = document.getElementById('content');
      if (contentNode){
        mo.observe(contentNode, { childList: true, subtree: true, attributes: true });
      }
    }

    // Resize after tab/subtab switches (your app.js replaces DOM + re-inits charts)
    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      if (btn.classList.contains('main-tab') || btn.classList.contains('subtab')){
        setTimeout(resizeAllECharts, 50);
        setTimeout(resizeAllECharts, 250);
      }
    });

    // Initial pass (after first render)
    window.addEventListener('load', function(){
      setTimeout(resizeAllECharts, 50);
      setTimeout(resizeAllECharts, 250);
    });
  })();
</script>
<script>
  (function () {
    const modal   = document.getElementById('scriptModal');
    const titleEl = document.getElementById('scriptModalTitle');
    const metaEl  = document.getElementById('scriptModalMeta');
    const editor  = document.getElementById('scriptEditor');

    const btnClose  = document.getElementById('scriptModalClose');
    const btnCancel = document.getElementById('scriptModalCancel');
    const btnSave   = document.getElementById('scriptModalSave');

    // Header tools
    const toolCopy     = document.getElementById('scriptToolCopy');
    const toolDownload = document.getElementById('scriptToolDownload');
    const toolReset    = document.getElementById('scriptToolReset');
    const toolClear    = document.getElementById('scriptToolClear');
    const toolSaveTop  = document.getElementById('scriptToolSaveTop');
    const toolAnalyze  = document.getElementById('scriptToolAnalyze');

    let activeScriptId = null;
    let activeScriptName = null;

    function setScriptModalSourceIcon(sourceIconEl){
      const headLeft = modal?.querySelector('.script-modal__head-left');
      if (!headLeft) return;

      // Remove any previous icon
      const prev = headLeft.querySelector('.script-modal__source-icon');
      if (prev) prev.remove();

      if (!sourceIconEl) return;

      // Clone the icon from the accordion row (so we keep the same styling)
      const wrap = document.createElement('span');
      wrap.className = 'script-modal__source-icon';
      wrap.appendChild(sourceIconEl.cloneNode(true));

      // Insert immediately before the title
      headLeft.insertBefore(wrap, titleEl);
    }

    function openScriptModal(scriptId, scriptName, sourceIconEl) {
      activeScriptId = scriptId;
      activeScriptName = scriptName;

      const saved = localStorage.getItem(`scriptText:${activeScriptId}`);
      const tpl = document.getElementById(activeScriptId);

      const initialText = saved ?? (tpl ? tpl.innerHTML.trim() : '[Missing script content]');

      setScriptModalSourceIcon(sourceIconEl);
      titleEl.textContent = activeScriptName || 'Video Script';

      editor.value = initialText;
      editor.dataset.originalText = initialText;

      if (typeof modal.showModal === 'function') modal.showModal();
      else modal.setAttribute('open', 'open'); // fallback (shouldn’t be needed on modern browsers)
    }

    function closeModal() {
      activeScriptId = null;
      activeScriptName = null;
      if (modal.open) modal.close();
    }

    function saveActiveScript() {
      if (!activeScriptId) return;
      localStorage.setItem(`scriptText:${activeScriptId}`, editor.value);
      closeModal();
    }

    // 1) Open modal from table link click (event delegation)
    document.addEventListener('click', (e) => {
      const link = e.target.closest('.script-link');
      if (!link) return;

      e.preventDefault();

      const scriptId = link.dataset.scriptId;
      const scriptName = link.textContent.trim();

      // Pull the logo icon dynamically from the accordion section this link is inside
      const group = link.closest('.lib-group');
      const sourceIconEl = group?.querySelector('.lib-group-head .lib-ic--logo') || group?.querySelector('.lib-group-head .lib-ic');

      openScriptModal(scriptId, scriptName, sourceIconEl);
    });

    // 2) Close buttons
    btnClose?.addEventListener('click', closeModal);
    btnCancel?.addEventListener('click', closeModal);

    // 3) Save buttons (top + footer)
    toolSaveTop?.addEventListener('click', saveActiveScript);
    btnSave?.addEventListener('click', saveActiveScript);

    // 4) Tool actions
    toolCopy?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(editor.value);
      } catch (err) {
        // fallback if clipboard permission is blocked
        editor.focus();
        editor.select();
        document.execCommand('copy');
      }
    });

    toolDownload?.addEventListener('click', () => {
      const filename = (activeScriptName || 'script')
        .replace(/[^\w\-]+/g, '_') + '.txt';

      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    });

    toolReset?.addEventListener('click', () => {
      editor.value = editor.dataset.originalText ?? '';
      editor.focus();
    });

    toolClear?.addEventListener('click', () => {
      editor.value = '';
      editor.focus();
    });

    toolAnalyze?.addEventListener('click', () => {
      const text = editor.value.trim();
      if (!text) {
        alert('There is no script text to analyze.');
        return;
      }

      const words = text.split(/\s+/).length;
      const chars = editor.value.length;

      // Demo placeholder
      alert(
        `Analysis Complete (Demo)\n\n` +
        `Words: ${words}\n` +
        `Characters: ${chars}\n\n` +
        `Next step: hook this to AI or rules-based analysis.`
      );
    });

    // Optional: close on backdrop click (dialog itself)
    modal?.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Optional: ESC key closes (native dialog already does this in most browsers)
  })();
</script>
